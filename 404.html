<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sayfa bulunamadı · Atlas</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d55c9'/%3E%3Cpath d='M9 24 16 8l7 16M11.6 18h8.8' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root { --bg: #f4f5f7; --ink: #17202a; --muted: #5d6875; --accent: #1d55c9; }
  @media (prefers-color-scheme: dark) { :root { --bg: #12161b; --ink: #e8ecf0; --muted: #9aa5b1; --accent: #7aa2ff; } }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--ink);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center;
  }
  h1 { margin: 0 0 8px; font-size: 56px; letter-spacing: -.03em; }
  p { margin: 0 0 24px; color: var(--muted); }
  a { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>404</h1>
  <p>Aradığınız sayfa bulunamadı.</p>
  <!-- GitHub Pages bu sayfayı istenen her derinlikteki URL'de sunar; göreli link
       yanlış yere gider. Bu yüzden tek istisna olarak proje kökü mutlak yazıldı. -->
  <a href="/atlas/">Ana sayfaya dön</a>
</main>
</body>
</html>
