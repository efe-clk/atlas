<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas</title>
<meta name="description" content="Birbirinden bağımsız atlasların toplandığı sayfa.">
<meta name="color-scheme" content="light dark">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Atlas">
<meta property="og:title" content="Atlas">
<meta property="og:description" content="Bilgiyi haritalayan atlaslar: her biri ayrı bir site olarak çalışan, sürekli büyüyen bir koleksiyon.">
<meta property="og:url" content="https://efe-clk.github.io/atlas/">
<meta property="og:locale" content="tr_TR">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d55c9'/%3E%3Cpath d='M9 24 16 8l7 16M11.6 18h8.8' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --ink: #17202a;
    --muted: #5d6875;
    --line: #dde2e8;
    --accent: #1d55c9;
    --shadow: 0 1px 2px rgba(20, 30, 40, .06), 0 4px 16px rgba(20, 30, 40, .05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161b;
      --surface: #1a2027;
      --ink: #e8ecf0;
      --muted: #9aa5b1;
      --line: #2a323c;
      --accent: #7aa2ff;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 880px; margin: 0 auto; padding: 56px 16px 48px; }
  header h1 { margin: 0 0 8px; font-size: clamp(28px, 6vw, 40px); letter-spacing: -.02em; }
  header p { margin: 0 0 32px; color: var(--muted); max-width: 60ch; }
  .grid { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .card {
    display: flex; flex-direction: column; gap: 8px; height: 100%;
    padding: 20px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--surface); box-shadow: var(--shadow);
    color: inherit; text-decoration: none;
    transition: border-color .15s, transform .15s;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card h2 { margin: 0; font-size: 19px; }
  .card p { margin: 0; color: var(--muted); font-size: 15px; flex: 1; }
  .card span { color: var(--accent); font-size: 14px; font-weight: 600; }
  footer { margin-top: 40px; color: var(--muted); font-size: 14px; }
  footer a { color: var(--accent); }
  @media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover { transform: none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Atlas</h1>
    <p>Birbirinden bağımsız, tek başına çalışan başvuru sayfaları. Birini seçip açın.</p>
  </header>

  <ul class="grid" id="atlas-list"></ul>

  <footer>Kaynak: <a href="https://github.com/efe-clk/atlas">github.com/efe-clk/atlas</a></footer>
</main>

<script>
  // Yeni atlas eklemek için bu diziye tek satır ekleyin. slug = klasör adı.
  const ATLASES = [
    { slug: "arayuz-atlasi", title: "Arayüz Atlası", desc: "Yazılımların birbiriyle nasıl konuştuğunu (API'ler, protokoller, kimlik doğrulama) canlı akış şemalarıyla anlatan terim rehberi." },
    { slug: "acik-kaynak-repo-atlasi", title: "Açık Kaynak Repo Atlası", desc: "Kod kalitesi, dokümantasyonu ya da topluluğuyla öne çıkan GitHub repolarının kategorilere ayrılmış, aranabilir dizini." },
    { slug: "dijital-diller-atlasi", title: "Dijital Diller Atlası", desc: "Devre tanımlamadan SQL'e kadar bilgisayar dili ailelerini soyutlama katmanlarına göre alt türleri ve kod örnekleriyle haritalayan rehber." },
    { slug: "bilgisayar-mimarisi-atlasi", title: "Bilgisayar Mimarisi Atlası", desc: "İşlemci çekirdeğinden önbelleklere, sanal bellekten kesmelere kadar bilgisayar mimarisini canlı akış şemaları ve boru hattı çizelgeleriyle anlatan rehber." },
    { slug: "linux-onyukleme-atlasi", title: "Linux Önyükleme Atlası", desc: "Güç düğmesinden masaüstüne: UEFI, önyükleyiciler, çekirdek, initramfs, systemd ve gömülü kartlarda önyüklemeyi adım adım, canlı şemalarla anlatan rehber." },
    { slug: "linux-dosya-sistemi-atlasi", title: "Linux Dosya Sistemi Atlası", desc: "Inode'dan btrfs anlık görüntülerine: VFS, sayfa önbelleği, ext4, XFS, btrfs, ZFS, bağlama, izinler ve sanal dosya sistemlerini canlı şemalarla anlatan rehber." },
    { slug: "komut-satiri-atlasi", title: "Komut Satırı Atlası", desc: "Kabuğun bir satırı nasıl yorumladığından boru hatlarına: genişletmeler, yönlendirme, dosya ve metin araçları, süreçler, ağ komutları, ssh ve güvenli betikleri canlı şemalarla anlatan rehber." },
  ];

  const list = document.getElementById("atlas-list");
  for (const a of ATLASES) {
    const li = document.createElement("li");
    const link = document.createElement("a");
    link.className = "card";
    link.href = "./" + a.slug + "/";
    const h2 = document.createElement("h2");
    h2.textContent = a.title;
    const p = document.createElement("p");
    p.textContent = a.desc;
    const go = document.createElement("span");
    go.textContent = "Aç →";
    link.append(h2, p, go);
    li.append(link);
    list.append(li);
  }
</script>
</body>
</html>
